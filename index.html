<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && true)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarTrain - Piano Ear Training</title>
    <meta name="description" content="A focused, distraction-free pathway for piano students to master hand positions through ear training exercises." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EarTrain - Piano Ear Training" />
    <meta property="og:description" content="A focused, distraction-free pathway for piano students to master hand positions through ear training exercises." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EarTrain - Piano Ear Training" />
    <meta name="twitter:description" content="A focused, distraction-free pathway for piano students to master hand positions through ear training exercises." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
